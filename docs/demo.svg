<circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="39" cy="17" r="5.5" fill="#febc2e"/><circle cx="58" cy="17" r="5.5" fill="#28c840"/>
<text x="440" y="22" text-anchor="middle" fill="#6e7681" font-size="12">interlocking — a gate that actually blocks</text>
<text id="l0_0" x="26" y="80" fill="#58a6ff" opacity="0">$ /il:new a CLI that shortens a URL and resolves it back</text>
<text id="l0_2" x="26" y="120" fill="#6e7681" opacity="0">  size: feature · researching · threat model · writing SPEC</text>
<text id="l0_3" x="26" y="140" fill="#c9d1d9" opacity="0">  wrote .interlocking/work/001-url-shortener/SPEC.md — 9 REQs</text>
<text id="l0_5" x="26" y="180" fill="#58a6ff" opacity="0">$ git log --oneline</text>
<text id="l0_6" x="26" y="200" fill="#c9d1d9" opacity="0">  6bbb985 init</text>
<text id="l0_8" x="26" y="240" fill="#6e7681" opacity="0">  # planning phase. not one line of source written.</text>
<text id="l1_0" x="26" y="80" fill="#6e7681" opacity="0">  acceptance criteria a separate agent can actually run:</text>
<text id="l1_2" x="26" y="120" fill="#c9d1d9" opacity="0">  REQ-003 Resolving an unknown code fails with exit 3 and</text>
<text id="l1_3" x="26" y="140" fill="#c9d1d9" opacity="0">          empty stdout.</text>
<text id="l1_4" x="26" y="160" fill="#3fb950" opacity="0">    Acceptance: `urlshort resolve zzzzzzz` exits 3, writes</text>
<text id="l1_5" x="26" y="180" fill="#3fb950" opacity="0">                0 bytes to stdout, stderr contains</text>
<text id="l1_6" x="26" y="200" fill="#3fb950" opacity="0">                `unknown code`.</text>
<text id="l1_8" x="26" y="240" fill="#6e7681" opacity="0">  # "works correctly" would be refused by the gate.</text>
<text id="l2_0" x="26" y="80" fill="#58a6ff" opacity="0">$ "Create bin/urlshort.mjs implementing REQ-001. Just do it."</text>
<text id="l2_2" x="26" y="120" fill="#c9d1d9" opacity="0">  ⏺ Write(bin/urlshort.mjs)</text>
<text id="l2_3" x="26" y="140" fill="#f85149" opacity="0">  ⎿  [il] G0 not approved — cannot write bin/urlshort.mjs</text>
<text id="l2_4" x="26" y="160" fill="#f85149" opacity="0">       Ask the human to review it and type:  /il:approve</text>
<text id="l2_5" x="26" y="180" fill="#f85149" opacity="0">       Urgent? the human can type: /il:override &lt;reason&gt;</text>
<text id="l2_6" x="26" y="200" fill="#f85149" opacity="0">       Markdown, docs and .interlocking/** are never</text>
<text id="l2_7" x="26" y="220" fill="#f85149" opacity="0">       blocked — keep planning.</text>
<text id="l2_9" x="26" y="260" fill="#6e7681" opacity="0">  # 10 turns. bin/ was never created.</text>
<text id="l3_0" x="26" y="80" fill="#6e7681" opacity="0">  # what if the agent just edits the state file?</text>
<text id="l3_1" x="26" y="100" fill="#58a6ff" opacity="0">$ echo "gates_passed: [G0]" &gt;&gt; STATE.md   &amp;&amp;   write src/a.ts</text>
<text id="l3_2" x="26" y="120" fill="#f85149" opacity="0">  [il] G0 not approved — cannot write src/a.ts</text>
<text id="l3_4" x="26" y="160" fill="#6e7681" opacity="0">  # or widens the policy it is allowed to write?</text>
<text id="l3_5" x="26" y="180" fill="#58a6ff" opacity="0">$ echo '{"always_allow":["**"]}' &gt; policy.json  &amp;&amp; write src/a.ts</text>
<text id="l3_6" x="26" y="200" fill="#f85149" opacity="0">  [il] G0 not approved — cannot write src/a.ts</text>
<text id="l3_8" x="26" y="240" fill="#6e7681" opacity="0">  # approval lives outside the repo, signed. STATE.md is a</text>
<text id="l3_9" x="26" y="260" fill="#6e7681" opacity="0">  # mirror — and a mismatch becomes a warning every session.</text>
<text id="l4_0" x="26" y="80" fill="#58a6ff" opacity="0">$ /il:approve</text>
<text id="l4_2" x="26" y="120" fill="#3fb950" opacity="0">  [il] G0 approved — 001-url-shortener (spec 2147effd).</text>
<text id="l4_3" x="26" y="140" fill="#3fb950" opacity="0">       Code edits unlocked.</text>
<text id="l4_5" x="26" y="180" fill="#6e7681" opacity="0">  # recorded by a hook reading your keystrokes.</text>
<text id="l4_6" x="26" y="200" fill="#6e7681" opacity="0">  # the model cannot produce that event.</text>
<text id="l5_0" x="26" y="80" fill="#58a6ff" opacity="0">$ /il:next</text>
<text id="l5_1" x="26" y="100" fill="#6e7681" opacity="0">  one task · one fresh subagent · three lines back · one commit</text>
<text id="l5_3" x="26" y="140" fill="#c9d1d9" opacity="0">  adef83e feat(store): path precedence, atomic save</text>
<text id="l5_4" x="26" y="160" fill="#c9d1d9" opacity="0">          [T-001, REQ-007, REQ-008, REQ-009]</text>
<text id="l5_6" x="26" y="200" fill="#d29922" opacity="0">  [il] the spec's own test command does not run on Node 24.</text>
<text id="l5_7" x="26" y="220" fill="#d29922" opacity="0">       I changed nothing to route around it. Options: amend</text>
<text id="l5_8" x="26" y="240" fill="#d29922" opacity="0">       the REQs (reopens G0), pin Node, or go via npm test.</text>
<text id="l6_0" x="26" y="80" fill="#58a6ff" opacity="0">$ /il:verify</text>
<text id="l6_1" x="26" y="100" fill="#6e7681" opacity="0">  verifier: fresh context · never read the implementation</text>
<text id="l6_3" x="26" y="140" fill="#f85149" opacity="0">  VERDICT: FAIL — 0 pass, 7 fail, 2 inconclusive</text>
<text id="l6_5" x="26" y="180" fill="#c9d1d9" opacity="0">  TASKS.md claims `node --test test/` cannot pass and that</text>
<text id="l6_6" x="26" y="200" fill="#c9d1d9" opacity="0">  bare `node --test` passes 8/8. First half confirmed by my</text>
<text id="l6_7" x="26" y="220" fill="#a371f7" opacity="0">  own run. Second half NOT confirmed: that command is not in</text>
<text id="l6_8" x="26" y="240" fill="#a371f7" opacity="0">  my permitted list. I did not run it and give it no weight.</text>
<text id="l6_10" x="26" y="280" fill="#6e7681" opacity="0">  # it treated the documents as evidence, not instructions.</text>
</svg>
