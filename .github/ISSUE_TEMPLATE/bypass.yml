name: Gate bypass
description: A way to write a source file while G0 is closed that interlocking does not catch
labels: [bypass]
body:
  - type: markdown
    attributes:
      value: |
        Thank you — this is the most useful report this project receives.

        The gate is **not a security boundary** and the README says so, so please
        discuss these openly. If instead you have found something that leaks data,
        executes unintended code, or compromises a machine, use the Security tab's
        private reporting rather than this form.

        Even better than an issue: add one line to `test/fixtures/bash-writes.txt`
        and open a PR. A fix without a corpus entry regresses silently.

  - type: textarea
    id: command
    attributes:
      label: The command or tool call
      description: Exactly what got through, verbatim.
      render: shell
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Which file was written, and what il printed (or did not print).
    validations:
      required: true

  - type: input
    id: doctor
    attributes:
      label: /il:doctor output
      description: Claude Code version, node, OS. Paste the first few lines.
    validations:
      required: true
