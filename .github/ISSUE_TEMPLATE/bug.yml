name: Bug
description: Something is broken, blocked when it should not be, or noisy
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Over-blocking is a bug, not a feature.** If interlocking stopped you from
        doing something legitimate, that is exactly the kind of report that keeps
        this usable — please file it.

        Immediate relief: `IL_DISABLE=1` turns every hook off.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command or prompt, and the state of the gate at the time.
    validations:
      required: true

  - type: input
    id: doctor
    attributes:
      label: /il:doctor output
      description: Hook behaviour differs between Claude Code versions, so this is usually the deciding detail.
    validations:
      required: true

  - type: textarea
    id: crash
    attributes:
      label: crash.log (if any)
      description: "`~/.interlocking/crash.log`. The hook fails open and stays quiet, so a bug can be silent."
      render: text
